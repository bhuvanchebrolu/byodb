<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYODB Workbench</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #09090b;
      --bg-panel: #121215;
      --bg-hover: #1c1c21;
      --border: #27272a;
      --border-focus: #52525b;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent-blue: #3b82f6;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-code: 'Fira Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      height: 50px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .db-path {
      font-family: var(--font-code);
      font-size: 12px;
      color: var(--text-muted);
      background: var(--bg-main);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .status-badge {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--accent-green);
      background: rgba(34, 197, 94, 0.08);
      font-family: var(--font-code);
    }

    /* Layout */
    .app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    aside {
      width: 280px;
      border-right: 1px solid var(--border);
      background: var(--bg-panel);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .btn-text {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-text:hover {
      background: var(--bg-hover);
      color: var(--text-main);
      border-color: var(--border-focus);
    }

    .schema-search-container {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }

    .schema-search {
      width: 100%;
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
      font-family: var(--font-main);
    }

    .schema-search:focus {
      border-color: var(--border-focus);
    }

    .table-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .table-item {
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg-main);
      overflow: hidden;
    }

    .table-name-row {
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
    }

    .table-name-title {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }

    .table-name-title:hover {
      color: var(--accent-blue);
    }

    .col-badge {
      font-size: 10px;
      color: var(--text-muted);
    }

    .col-list {
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .col-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-family: var(--font-code);
      color: var(--text-muted);
    }

    .col-name {
      color: var(--text-main);
    }

    .col-type {
      font-size: 10px;
      color: var(--text-muted);
    }

    .col-tag {
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 2px;
      background: var(--border);
      color: var(--text-main);
      margin-left: 4px;
    }

    .index-meta {
      font-size: 10px;
      font-family: var(--font-code);
      color: var(--text-muted);
      padding-top: 4px;
      border-top: 1px dashed var(--border);
      margin-top: 4px;
    }

    /* Main Area */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 14px;
      gap: 14px;
    }

    .card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor-card {
      height: 220px;
      min-height: 160px;
    }

    .card-header {
      padding: 10px 14px;
      background: var(--bg-main);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .editor-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    select.snippet-select {
      background: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }

    select.snippet-select:focus {
      border-color: var(--border-focus);
    }

    .btn-action {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-family: var(--font-main);
      cursor: pointer;
    }

    .btn-action:hover {
      background: var(--bg-hover);
      border-color: var(--border-focus);
    }

    .btn-primary {
      background: var(--accent-blue);
      color: #ffffff;
      border: 1px solid var(--accent-blue);
      padding: 4px 14px;
      border-radius: 4px;
      font-weight: 500;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .query-textarea {
      flex: 1;
      width: 100%;
      background: var(--bg-main);
      border: none;
      color: var(--text-main);
      font-family: var(--font-code);
      font-size: 13px;
      padding: 12px 14px;
      resize: none;
      outline: none;
      line-height: 1.5;
    }

    /* Results */
    .results-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .results-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      font-family: var(--font-code);
      color: var(--text-muted);
    }

    .results-body {
      flex: 1;
      overflow: auto;
      background: var(--bg-main);
    }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      font-family: var(--font-code);
      text-align: left;
    }

    table.data-table th {
      background: var(--bg-panel);
      position: sticky;
      top: 0;
      padding: 8px 12px;
      font-weight: 500;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      font-size: 11px;
    }

    table.data-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
    }

    table.data-table tr:hover td {
      background: var(--bg-hover);
    }

    .empty-results {
      padding: 30px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    .error-box {
      margin: 12px;
      padding: 10px 14px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid var(--accent-red);
      border-radius: 4px;
      color: var(--accent-red);
      font-family: var(--font-code);
      font-size: 12px;
      white-space: pre-wrap;
    }

    /* Metrics Bar */
    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      height: 60px;
    }

    .metric-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .metric-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .metric-value {
      font-family: var(--font-code);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-title">BYODB Workbench</div>
    </div>
    <div class="header-info">
      <div id="txBadge" class="status-badge">TX: Auto-Commit</div>
      <div id="dbPath" class="db-path">database.db</div>
    </div>
  </header>

  <div class="app-container">
    <aside>
      <div class="sidebar-header">
        <span class="sidebar-title">Tables</span>
        <button class="btn-text" onclick="loadSchema()">Refresh</button>
      </div>
      <div class="schema-search-container">
        <input type="text" id="schemaSearch" class="schema-search" placeholder="Filter tables..." oninput="filterTables()">
      </div>
      <div id="tableList" class="table-list">
        <!-- Loaded dynamically -->
      </div>
    </aside>

    <main>
      <div class="card editor-card">
        <div class="card-header">
          <div class="card-title">SQL Query Editor</div>
          <div class="editor-actions">
            <select id="snippetSelect" class="snippet-select" onchange="insertSnippet(this.value)">
              <option value="">Snippets</option>
              <option value="create_ecom">Create Table</option>
              <option value="insert_ecom">Insert Data</option>
              <option value="select_all">Select All</option>
              <option value="range_float">Range Scan</option>
              <option value="count_query">Count Aggregation</option>
              <option value="tx_demo">Transaction Test</option>
            </select>
            <button class="btn-action" onclick="runQueryDirect('BEGIN;')">BEGIN</button>
            <button class="btn-action" onclick="runQueryDirect('COMMIT;')">COMMIT</button>
            <button class="btn-action" onclick="runQueryDirect('ROLLBACK;')">ROLLBACK</button>
            <button class="btn-primary" onclick="runQuery()">Run (Ctrl+Enter)</button>
          </div>
        </div>
        <textarea id="queryInput" class="query-textarea" placeholder="Type SQL query here..." spellcheck="false"></textarea>
      </div>

      <div class="card results-card">
        <div class="card-header">
          <div class="card-title">Execution Output</div>
          <div class="results-meta">
            <span id="timePill" style="display:none;">0.00 ms</span>
            <span id="rowPill" style="display:none;">0 rows</span>
          </div>
        </div>
        <div id="resultsBody" class="results-body">
          <div class="empty-results">Execute a query to view results.</div>
        </div>
      </div>

      <div class="metrics-bar">
        <div class="metric-card">
          <div class="metric-label">File Size</div>
          <div id="metricFileSize" class="metric-value">--</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Allocated Pages</div>
          <div id="metricPages" class="metric-value">--</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Page Size</div>
          <div class="metric-value">4096 B</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Tables</div>
          <div id="metricTables" class="metric-value">--</div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const snippets = {
      create_ecom: "create table products (\n    id int64,\n    name bytes,\n    price float64,\n    category bytes,\n    index (price),\n    primary key (id)\n);",
      insert_ecom: "insert into products (id, name, price, category) values\n    (1, 'Gaming Laptop', 1299.99, 'electronics'),\n    (2, 'Wireless Mouse', 24.50, 'electronics'),\n    (3, 'Mechanical Keyboard', 89.99, 'electronics'),\n    (4, 'Coffee Mug', 12.00, 'home');",
      select_all: "select id, name, price, category from products;",
      range_float: "select name, price from products index by price > 30.0;",
      count_query: "select count(*) from products filter price > 20.0;",
      tx_demo: "BEGIN;\nINSERT INTO products (id, name, price, category) VALUES (99, 'Temporary Product', 9.99, 'test');\nROLLBACK;"
    };

    function insertSnippet(key) {
      if (snippets[key]) {
        document.getElementById('queryInput').value = snippets[key];
      }
    }

    function updateTxStatus(inTx) {
      const badge = document.getElementById('txBadge');
      if (!badge) return;

      if (inTx) {
        badge.style.color = 'var(--accent-red)';
        badge.style.background = 'rgba(239, 68, 68, 0.08)';
        badge.style.borderColor = 'rgba(239, 68, 68, 0.3)';
        badge.innerText = 'TX: Active (Uncommitted)';
      } else {
        badge.style.color = 'var(--accent-green)';
        badge.style.background = 'rgba(34, 197, 94, 0.08)';
        badge.style.borderColor = 'rgba(34, 197, 94, 0.3)';
        badge.innerText = 'TX: Auto-Commit';
      }
    }

    document.getElementById('queryInput').addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        runQuery();
      }
    });

    let cachedTables = [];

    async function loadSchema() {
      try {
        const res = await fetch('/api/tables');
        const data = await res.json();
        cachedTables = data.tables || [];
        document.getElementById('metricTables').innerText = cachedTables.length;
        if (data.in_tx !== undefined) updateTxStatus(data.in_tx);
        filterTables();
      } catch (err) {
        console.error("Failed to load schema:", err);
      }
    }

    function filterTables() {
      const q = (document.getElementById('schemaSearch')?.value || '').toLowerCase();
      const filtered = cachedTables.filter(t => {
        const name = (t.name || t.Name || '').toLowerCase();
        const cols = (t.cols || t.Cols || []);
        return name.includes(q) || cols.some(c => c.toLowerCase().includes(q));
      });
      renderTables(filtered);
    }

    function renderTables(tables) {
      const listEl = document.getElementById('tableList');
      listEl.innerHTML = '';

      if (!tables || tables.length === 0) {
        listEl.innerHTML = '<div style="padding: 16px; color: var(--text-muted); font-size:12px; text-align:center;">No tables found.</div>';
        return;
      }

      tables.forEach(table => {
        const item = document.createElement('div');
        item.className = 'table-item';

        const tableName = table.name || table.Name || '';
        const tableCols = table.cols || table.Cols || [];
        const tableTypes = table.types || table.Types || [];
        const tableIndexes = table.indexes || table.Indexes || [];

        let pkeys = new Set(tableIndexes.length > 0 ? tableIndexes[0] : []);
        let idxCols = new Set();
        if (tableIndexes.length > 1) {
          tableIndexes.slice(1).forEach(idx => idx.forEach(c => idxCols.add(c)));
        }

        let colsHtml = '';
        tableCols.forEach((col, idx) => {
          let typeName = 'bytes';
          if (tableTypes[idx] === 2) typeName = 'int64';
          if (tableTypes[idx] === 3) typeName = 'float64';
          let isPk = pkeys.has(col);
          let isIdx = idxCols.has(col);

          colsHtml += `
            <div class="col-item">
              <span>
                <span class="col-name">${col}</span>
                ${isPk ? '<span class="col-tag">PK</span>' : ''}
                ${isIdx ? '<span class="col-tag">IDX</span>' : ''}
              </span>
              <span class="col-type">${typeName}</span>
            </div>
          `;
        });

        let idxListHtml = '';
        if (tableIndexes.length > 0) {
          let pkeyStr = tableIndexes[0].join(', ');
          idxListHtml += `<div class="index-meta">PK: (${pkeyStr})</div>`;
          tableIndexes.slice(1).forEach(idx => {
            idxListHtml += `<div class="index-meta">IDX: (${idx.join(', ')})</div>`;
          });
        }

        item.innerHTML = `
          <div class="table-name-row">
            <div class="table-name-title" onclick="toggleTable('cols-${tableName}')">
              <span id="arrow-cols-${tableName}" style="font-size:9px;">v</span>
              <span>${tableName}</span>
              <span class="col-badge">(${tableCols.length})</span>
            </div>
            <button class="btn-text" style="font-size:10px; padding:2px 6px;" onclick="setQuery('select * from ${tableName};'); event.stopPropagation();">SELECT</button>
          </div>
          <div class="col-list" id="cols-${tableName}">
            ${colsHtml}
            ${idxListHtml}
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    function toggleTable(id) {
      const el = document.getElementById(id);
      const arrow = document.getElementById('arrow-' + id);
      if (!el) return;
      if (el.style.display === 'none') {
        el.style.display = 'flex';
        if (arrow) arrow.innerText = 'v';
      } else {
        el.style.display = 'none';
        if (arrow) arrow.innerText = '>';
      }
    }

    function setQuery(sql) {
      document.getElementById('queryInput').value = sql;
      runQuery();
    }

    function runQueryDirect(sql) {
      document.getElementById('queryInput').value = sql;
      runQuery();
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        const stats = await res.json();
        document.getElementById('dbPath').innerText = stats.path || 'database.db';
        document.getElementById('metricFileSize').innerText = formatBytes(stats.fileSizeBytes || 0);
        document.getElementById('metricPages').innerText = stats.pageCount || 0;
        if (stats.in_tx !== undefined) updateTxStatus(stats.in_tx);
      } catch (err) {
        console.error("Failed to load stats:", err);
      }
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    async function runQuery() {
      const query = document.getElementById('queryInput').value.trim();
      if (!query) return;

      const bodyEl = document.getElementById('resultsBody');
      const timePill = document.getElementById('timePill');
      const rowPill = document.getElementById('rowPill');

      timePill.style.display = 'none';
      rowPill.style.display = 'none';
      bodyEl.innerHTML = '<div class="empty-results">Executing query...</div>';

      const startTime = performance.now();

      try {
        const res = await fetch('/api/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });
        const duration = (performance.now() - startTime).toFixed(2);
        const data = await res.json();

        timePill.innerText = `${duration} ms`;
        timePill.style.display = 'inline-block';
        if (data.in_tx !== undefined) updateTxStatus(data.in_tx);

        if (data.error) {
          bodyEl.innerHTML = `<div class="error-box">Error: ${data.error}</div>`;
          return;
        }

        if (data.affected !== undefined && data.affected >= 0 && (!data.rows || data.rows.length === 0)) {
          rowPill.innerText = `${data.affected} row(s) affected`;
          rowPill.style.display = 'inline-block';
          bodyEl.innerHTML = `<div class="empty-results" style="color: var(--accent-green);">Statement executed: ${data.affected} row(s) affected.</div>`;
          loadSchema();
          loadStats();
          return;
        }

        if (data.columns && data.rows) {
          rowPill.innerText = `${data.rows.length} row(s)`;
          rowPill.style.display = 'inline-block';

          let tableHtml = '<table class="data-table"><thead><tr>';
          data.columns.forEach(col => {
            tableHtml += `<th>${col}</th>`;
          });
          tableHtml += '</tr></thead><tbody>';

          data.rows.forEach(row => {
            tableHtml += '<tr>';
            row.forEach(cell => {
              tableHtml += `<td>${cell !== null ? cell : 'NULL'}</td>`;
            });
            tableHtml += '</tr>';
          });
          tableHtml += '</tbody></table>';

          bodyEl.innerHTML = tableHtml;
        } else {
          bodyEl.innerHTML = '<div class="empty-results">Statement executed successfully.</div>';
        }

        loadSchema();
        loadStats();
      } catch (err) {
        bodyEl.innerHTML = `<div class="error-box">Network Error: ${err.message}</div>`;
      }
    }

    // Initial Load
    window.addEventListener('load', () => {
      document.getElementById('queryInput').value = snippets.create_ecom;
      loadSchema();
      loadStats();
    });
  </script>
</body>
</html>
