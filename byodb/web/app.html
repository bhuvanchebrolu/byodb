<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYODB - Database Workbench</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #090d16;
      --bg-card: rgba(18, 26, 43, 0.75);
      --bg-card-hover: rgba(26, 38, 62, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(56, 189, 248, 0.3);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-emerald: #34d399;
      --accent-purple: #c084fc;
      --accent-rose: #fb7185;
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-title: 'Outfit', sans-serif;
      --font-code: 'Fira Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(192, 132, 252, 0.1) 0px, transparent 50%);
      color: var(--text-main);
      font-family: var(--font-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      height: 60px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(9, 13, 22, 0.8);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-emerald));
      color: #090d16;
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 16px;
      padding: 6px 12px;
      border-radius: 8px;
      letter-spacing: 0.5px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    .brand-title {
      font-family: var(--font-title);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--accent-emerald);
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.2);
      padding: 4px 12px;
      border-radius: 20px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-emerald);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-emerald);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .db-path {
      font-family: var(--font-code);
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    /* Main Container */
    .app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    aside {
      width: 300px;
      border-right: 1px solid var(--border-color);
      background: rgba(13, 19, 33, 0.6);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border-color: var(--accent-cyan);
    }

    .table-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .schema-search-container {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .schema-search {
      width: 100%;
      background: rgba(9, 13, 22, 0.7);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      font-family: var(--font-main);
    }

    .schema-search:focus {
      border-color: var(--accent-cyan);
    }

    .table-item {
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: rgba(18, 26, 43, 0.4);
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .table-item:hover {
      border-color: var(--border-accent);
      background: rgba(18, 26, 43, 0.8);
    }

    .table-name-row {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border-color);
    }

    .table-name-title {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
      user-select: none;
    }

    .table-name-title:hover {
      color: var(--accent-cyan);
    }

    .col-badge {
      font-size: 10px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-cyan);
      padding: 2px 6px;
      border-radius: 10px;
    }

    .btn-xs {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-cyan);
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-xs:hover {
      background: var(--accent-cyan);
      color: #090d16;
    }

    .col-list {
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .col-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-family: var(--font-code);
      color: var(--text-muted);
    }

    .col-type {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      text-transform: uppercase;
      color: var(--accent-cyan);
    }

    .col-pk {
      color: var(--accent-emerald);
      font-weight: bold;
    }

    .col-idx {
      color: var(--accent-purple);
    }

    .index-meta {
      font-size: 11px;
      font-family: var(--font-code);
      color: var(--text-muted);
      padding-top: 6px;
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
      margin-top: 4px;
    }

    /* Workspace Panel */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 20px;
      gap: 20px;
    }

    /* Query Editor Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor-card {
      height: 240px;
      min-height: 180px;
    }

    .card-header {
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .editor-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    select.snippet-select {
      background: rgba(13, 19, 33, 0.9);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    select.snippet-select:hover {
      border-color: var(--accent-cyan);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.45);
    }

    .query-textarea {
      flex: 1;
      width: 100%;
      background: rgba(9, 13, 22, 0.6);
      border: none;
      color: #e2e8f0;
      font-family: var(--font-code);
      font-size: 14px;
      padding: 16px 20px;
      resize: none;
      outline: none;
      line-height: 1.6;
    }

    /* Results Section */
    .results-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .results-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .meta-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 2px 10px;
      border-radius: 12px;
      font-family: var(--font-code);
    }

    .results-body {
      flex: 1;
      overflow: auto;
      padding: 0;
    }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }

    table.data-table th {
      background: rgba(18, 26, 43, 0.95);
      position: sticky;
      top: 0;
      padding: 12px 18px;
      font-weight: 600;
      color: var(--accent-cyan);
      border-bottom: 1px solid var(--border-color);
      font-family: var(--font-code);
      font-size: 12px;
      text-transform: uppercase;
    }

    table.data-table td {
      padding: 10px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      font-family: var(--font-code);
      color: var(--text-main);
    }

    table.data-table tr:hover td {
      background: rgba(56, 189, 248, 0.04);
    }

    .empty-results {
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    .error-box {
      margin: 16px;
      padding: 14px 18px;
      background: rgba(251, 113, 133, 0.1);
      border: 1px solid rgba(251, 113, 133, 0.3);
      border-radius: 8px;
      color: var(--accent-rose);
      font-family: var(--font-code);
      font-size: 13px;
      white-space: pre-wrap;
    }

    /* Engine Stats Footer Bar */
    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      height: 80px;
    }

    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .metric-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .metric-value {
      font-family: var(--font-title);
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-cyan);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo-badge">BYODB</div>
      <div class="brand-title">Relational Database Workbench</div>
    </div>
    <div class="header-info">
      <div class="status-badge">
        <span class="status-dot"></span> B+Tree Engine Active
      </div>
      <div id="dbPath" class="db-path">database.db</div>
    </div>
  </header>

  <div class="app-container">
    <aside>
      <div class="sidebar-header">
        <span class="sidebar-title">Tables & Schemas</span>
        <button class="btn-icon" title="Refresh Schema" onclick="loadSchema()">🔄</button>
      </div>
      <div class="schema-search-container">
        <input type="text" id="schemaSearch" class="schema-search" placeholder="Filter tables or columns..." oninput="filterTables()">
      </div>
      <div id="tableList" class="table-list">
        <!-- Loaded dynamically -->
      </div>
    </aside>

    <main>
      <div class="card editor-card">
        <div class="card-header">
          <div class="card-title">
            <span>⚡</span> SQL Query Editor
          </div>
          <div class="editor-actions">
            <select id="snippetSelect" class="snippet-select" onchange="insertSnippet(this.value)">
              <option value="">-- Load Quick Snippet --</option>
              <option value="create_ecom">1. Create E-Commerce Table</option>
              <option value="insert_ecom">2. Insert Seed Products</option>
              <option value="select_all">3. Select All Products</option>
              <option value="range_float">4. Float Range Scan (Price > 30.0)</option>
              <option value="count_query">5. Count Aggregation (COUNT(*))</option>
            </select>
            <button class="btn-primary" onclick="runQuery()">
              ▶ Run Query <span style="font-weight:normal; opacity:0.7; font-size:11px;">(Ctrl+Enter)</span>
            </button>
          </div>
        </div>
        <textarea id="queryInput" class="query-textarea" placeholder="Type SQL query here (e.g., select * from people)..." spellcheck="false"></textarea>
      </div>

      <div class="card results-card">
        <div class="card-header">
          <div class="card-title">
            <span>📊</span> Execution Output & Results
          </div>
          <div class="results-meta">
            <span id="timePill" class="meta-pill" style="display:none;">⚡ 0.00 ms</span>
            <span id="rowPill" class="meta-pill" style="display:none;">0 rows</span>
          </div>
        </div>
        <div id="resultsBody" class="results-body">
          <div class="empty-results">Execute a query above to display output results.</div>
        </div>
      </div>

      <div class="metrics-bar">
        <div class="metric-card">
          <div class="metric-label">Database File Size</div>
          <div id="metricFileSize" class="metric-value">--</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Total Allocated Pages</div>
          <div id="metricPages" class="metric-value">--</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Page Size</div>
          <div class="metric-value">4096 B</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Total Tables</div>
          <div id="metricTables" class="metric-value">--</div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const snippets = {
      create_ecom: "create table products (\n    id int64,\n    name bytes,\n    price float64,\n    category bytes,\n    index (price),\n    primary key (id)\n);",
      insert_ecom: "insert into products (id, name, price, category) values\n    (1, 'Gaming Laptop', 1299.99, 'electronics'),\n    (2, 'Wireless Mouse', 24.50, 'electronics'),\n    (3, 'Mechanical Keyboard', 89.99, 'electronics'),\n    (4, 'Coffee Mug', 12.00, 'home');",
      select_all: "select id, name, price, category from products;",
      range_float: "select name, price from products index by price > 30.0;",
      count_query: "select count(*) from products filter price > 20.0;"
    };

    function insertSnippet(key) {
      if (snippets[key]) {
        document.getElementById('queryInput').value = snippets[key];
      }
    }

    document.getElementById('queryInput').addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        runQuery();
      }
    });

    let cachedTables = [];

    async function loadSchema() {
      try {
        const res = await fetch('/api/tables');
        const data = await res.json();
        cachedTables = data.tables || [];
        document.getElementById('metricTables').innerText = cachedTables.length;
        filterTables();
      } catch (err) {
        console.error("Failed to load schema:", err);
      }
    }

    function filterTables() {
      const q = (document.getElementById('schemaSearch')?.value || '').toLowerCase();
      const filtered = cachedTables.filter(t => {
        const name = (t.name || t.Name || '').toLowerCase();
        const cols = (t.cols || t.Cols || []);
        return name.includes(q) || cols.some(c => c.toLowerCase().includes(q));
      });
      renderTables(filtered);
    }

    function renderTables(tables) {
      const listEl = document.getElementById('tableList');
      listEl.innerHTML = '';

      if (!tables || tables.length === 0) {
        listEl.innerHTML = '<div style="padding: 16px; color: var(--text-muted); font-size:13px; text-align:center;">No tables found.</div>';
        return;
      }

      tables.forEach(table => {
        const item = document.createElement('div');
        item.className = 'table-item';

        const tableName = table.name || table.Name || '';
        const tableCols = table.cols || table.Cols || [];
        const tableTypes = table.types || table.Types || [];
        const tableIndexes = table.indexes || table.Indexes || [];

        let pkeys = new Set(tableIndexes.length > 0 ? tableIndexes[0] : []);
        let idxCols = new Set();
        if (tableIndexes.length > 1) {
          tableIndexes.slice(1).forEach(idx => idx.forEach(c => idxCols.add(c)));
        }

        let colsHtml = '';
        tableCols.forEach((col, idx) => {
          let typeName = 'bytes';
          if (tableTypes[idx] === 2) typeName = 'int64';
          if (tableTypes[idx] === 3) typeName = 'float64';
          let isPk = pkeys.has(col);
          let isIdx = idxCols.has(col);

          colsHtml += `
            <div class="col-item">
              <span>
                ${isPk ? '<span class="col-pk" title="Primary Key">🔑</span> ' : ''}
                ${isIdx ? '<span class="col-idx" title="Secondary Index">🔍</span> ' : ''}
                <strong style="color:var(--text-main);">${col}</strong>
              </span>
              <span class="col-type">${typeName}</span>
            </div>
          `;
        });

        let idxListHtml = '';
        if (tableIndexes.length > 0) {
          let pkeyStr = tableIndexes[0].join(', ');
          idxListHtml += `<div class="index-meta"><strong>PK:</strong> (${pkeyStr})</div>`;
          tableIndexes.slice(1).forEach(idx => {
            idxListHtml += `<div class="index-meta"><strong>IDX:</strong> (${idx.join(', ')})</div>`;
          });
        }

        item.innerHTML = `
          <div class="table-name-row">
            <div class="table-name-title" onclick="toggleTable('cols-${tableName}')">
              <span id="arrow-cols-${tableName}" style="font-size:10px; display:inline-block; transition:transform 0.2s;">▼</span>
              <span>📋 <strong>${tableName}</strong></span>
              <span class="col-badge">${tableCols.length} cols</span>
            </div>
            <button class="btn-xs" title="Query SELECT *" onclick="setQuery('select * from ${tableName};'); event.stopPropagation();">SELECT *</button>
          </div>
          <div class="col-list" id="cols-${tableName}">
            ${colsHtml}
            ${idxListHtml}
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    function toggleTable(id) {
      const el = document.getElementById(id);
      const arrow = document.getElementById('arrow-' + id);
      if (!el) return;
      if (el.style.display === 'none') {
        el.style.display = 'flex';
        if (arrow) arrow.style.transform = 'rotate(0deg)';
      } else {
        el.style.display = 'none';
        if (arrow) arrow.style.transform = 'rotate(-90deg)';
      }
    }

    function setQuery(sql) {
      document.getElementById('queryInput').value = sql;
      runQuery();
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        const stats = await res.json();
        document.getElementById('dbPath').innerText = stats.path || 'database.db';
        document.getElementById('metricFileSize').innerText = formatBytes(stats.fileSizeBytes || 0);
        document.getElementById('metricPages').innerText = stats.pageCount || 0;
      } catch (err) {
        console.error("Failed to load stats:", err);
      }
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    async function runQuery() {
      const query = document.getElementById('queryInput').value.trim();
      if (!query) return;

      const bodyEl = document.getElementById('resultsBody');
      const timePill = document.getElementById('timePill');
      const rowPill = document.getElementById('rowPill');

      timePill.style.display = 'none';
      rowPill.style.display = 'none';
      bodyEl.innerHTML = '<div class="empty-results">Executing query...</div>';

      const startTime = performance.now();

      try {
        const res = await fetch('/api/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });
        const duration = (performance.now() - startTime).toFixed(2);
        const data = await res.json();

        timePill.innerText = `⚡ ${duration} ms`;
        timePill.style.display = 'inline-block';

        if (data.error) {
          bodyEl.innerHTML = `<div class="error-box">Error: ${data.error}</div>`;
          return;
        }

        if (data.affected !== undefined && data.affected >= 0 && (!data.rows || data.rows.length === 0)) {
          rowPill.innerText = `${data.affected} row(s) affected`;
          rowPill.style.display = 'inline-block';
          bodyEl.innerHTML = `<div class="empty-results" style="color: var(--accent-emerald);">Success: ${data.affected} row(s) affected.</div>`;
          loadSchema();
          loadStats();
          return;
        }

        if (data.columns && data.rows) {
          rowPill.innerText = `${data.rows.length} row(s)`;
          rowPill.style.display = 'inline-block';

          let tableHtml = '<table class="data-table"><thead><tr>';
          data.columns.forEach(col => {
            tableHtml += `<th>${col}</th>`;
          });
          tableHtml += '</tr></thead><tbody>';

          data.rows.forEach(row => {
            tableHtml += '<tr>';
            row.forEach(cell => {
              tableHtml += `<td>${cell !== null ? cell : 'NULL'}</td>`;
            });
            tableHtml += '</tr>';
          });
          tableHtml += '</tbody></table>';

          bodyEl.innerHTML = tableHtml;
        } else {
          bodyEl.innerHTML = '<div class="empty-results">Statement executed successfully.</div>';
        }

        loadSchema();
        loadStats();
      } catch (err) {
        bodyEl.innerHTML = `<div class="error-box">Network Error: ${err.message}</div>`;
      }
    }

    // Initial Load
    window.addEventListener('load', () => {
      document.getElementById('queryInput').value = snippets.create_ecom;
      loadSchema();
      loadStats();
    });
  </script>
</body>
</html>
